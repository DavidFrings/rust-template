# Konfiguration für cargo-deny (Workflow rust-security.yml aus rust-ci).
# Beim ersten Lauf zeigt `cargo deny check licenses` Lizenzen an, die noch in
# `allow` fehlen. Bewusst entscheiden, nicht blind alles erlauben.

[graph]
all-features = true

[advisories]
yanked = "warn"
# Ausnahmen nur mit Begründung, z. B.:
# ignore = ["RUSTSEC-0000-0000"]

[licenses]
allow = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "CC0-1.0",
    "MPL-2.0",
    "Unicode-3.0",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8

[bans]
multiple-versions = "warn"
wildcards = "deny"
allow-wildcard-paths = true

[sources]
unknown-registry = "deny"
unknown-git = "deny"
allow-registry = ["https://github.com/rust-lang/crates.io-index"]
allow-git = []
