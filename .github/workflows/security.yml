name: Security

on:
  push:
    branches: [main]
    paths:
      - "**/Cargo.toml"
      - "Cargo.lock"
      - "deny.toml"
      - ".github/workflows/security.yml"
  pull_request:
    paths:
      - "**/Cargo.toml"
      - "Cargo.lock"
      - "deny.toml"
      - ".github/workflows/security.yml"
  schedule:
    # Montags, damit neue RustSec-Advisories auch ohne Commits auffallen
    - cron: "23 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deny:
    if: ${{ !github.event.repository.is_template }}
    uses: DavidFrings/rust-ci/.github/workflows/rust-security.yml@v1
